<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Subway Cleaners 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#111;font-family:Arial;color:white;touch-action:none}
#ui{position:absolute;top:15px;left:15px;right:15px;display:flex;justify-content:space-between;z-index:5;font-weight:bold;font-size:18px;text-shadow:0 2px 5px black}
#message{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#0009;z-index:10;text-align:center;padding:20px}
h1{font-size:36px;color:#8cff65;text-shadow:0 3px 8px black}
button{border:0;border-radius:14px;background:#54d94c;color:#102010;font-size:21px;font-weight:bold;padding:15px 35px;margin:10px}
#controls{position:absolute;bottom:20px;left:0;right:0;display:flex;justify-content:space-between;padding:0 20px;z-index:5}
#controls button{background:#ffffffbb;padding:14px 22px}
.small{font-size:14px;color:#ddd;line-height:1.7}
</style>
</head>
<body>
<div id="ui">
 <div>🧹 <span id="trash">0</span></div>
 <div>⭐ <span id="score">0</span></div>
 <div>🏃 <span id="speed">1</span></div>
</div>

<div id="message">
 <h1>SUBWAY<br>CLEANERS</h1>
 <p>Clean the city! Collect trash!</p>
 <p class="small">Swipe left/right to move<br>Swipe up to jump • Swipe down to slide</p>
 <button id="start">PLAY NOW</button>
</div>

<div id="controls">
 <button id="left">⬅️</button>
 <button id="jump">⬆️</button>
 <button id="slide">⬇️</button>
 <button id="right">➡️</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb,35,110);

const camera = new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,200);
camera.position.set(0,5,10);
camera.lookAt(0,1,0);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x526344,2));
const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(-5,12,8);
sun.castShadow=true;
scene.add(sun);

const mat=(color)=>new THREE.MeshStandardMaterial({color,roughness:.8});
const green=mat(0x36a852);
const dark=mat(0x333333);
const rail=mat(0xaaaaaa);

// Ground
const ground=new THREE.Mesh(new THREE.PlaneGeometry(80,150),green);
ground.rotation.x=-Math.PI/2;
ground.position.z=-35;
ground.receiveShadow=true;
scene.add(ground);

// Three running lanes
const track=new THREE.Mesh(new THREE.PlaneGeometry(10,150),dark);
track.rotation.x=-Math.PI/2;
track.position.set(0,.015,-35);
scene.add(track);

for(let x of [-1.7,1.7]){
 const line=new THREE.Mesh(new THREE.BoxGeometry(.06,.03,150),mat(0xffffff));
 line.position.set(x,.04,-35);
 scene.add(line);
}

// Track details
const sleepers=[];
for(let z=8;z>-100;z-=2){
 const s=new THREE.Mesh(new THREE.BoxGeometry(9,.12,.18),mat(0x72523b));
 s.position.set(0,.1,z);
 scene.add(s);
 sleepers.push(s);
}

// Player
const player=new THREE.Group();
scene.add(player);
player.position.set(0,0,3);

const body=new THREE.Mesh(new THREE.BoxGeometry(.65,1,.42),mat(0x1768d1));
body.position.y=1.05;
body.castShadow=true;
player.add(body);

const head=new THREE.Mesh(new THREE.SphereGeometry(.29,20,16),mat(0xffc58a));
head.position.y=1.78;
player.add(head);

const hair=new THREE.Mesh(new THREE.SphereGeometry(.3,16,12),mat(0x34251d));
hair.position.set(0,1.92,0);
player.add(hair);

const legs=[];
for(let x of [-.19,.19]){
 const leg=new THREE.Mesh(new THREE.BoxGeometry(.2,.65,.25),mat(0x202b44));
 leg.position.set(x,.38,0);
 player.add(leg);
 legs.push(leg);
}
const arms=[];
for(let x of [-.42,.42]){
 const arm=new THREE.Mesh(new THREE.BoxGeometry(.17,.65,.2),mat(0xffc58a));
 arm.position.set(x,1.05,0);
 player.add(arm);
 arms.push(arm);
}

// Buildings
for(let side of [-1,1]){
 for(let z=0;z>-100;z-=12){
  const h=5+Math.random()*10;
  const building=new THREE.Mesh(
   new THREE.BoxGeometry(5,h,8),
   mat([0xd9b58c,0xb2c7d9,0xc7b4a1][Math.floor(Math.random()*3)])
  );
  building.position.set(side*9,h/2,z);
  scene.add(building);
 }
}

// Trash objects and obstacles
const objects=[];
function makeTrash(x,z){
 const group=new THREE.Group();
 const bottle=new THREE.Mesh(
  new THREE.CylinderGeometry(.16,.18,.5,12),
  mat(0x28c9a0)
 );
 bottle.rotation.z=Math.PI/2;
 bottle.position.y=.35;
 group.add(bottle);
 const cap=new THREE.Mesh(
  new THREE.CylinderGeometry(.08,.08,.1,10),
  mat(0xeeeeee)
 );
 cap.position.set(.25,.35,0);
 group.add(cap);
 group.position.set(x,0,z);
 scene.add(group);
 objects.push({mesh:group,type:"trash"});
}

function makeObstacle(x,z){
 const group=new THREE.Group();
 const color=mat(0xc83b32);
 const train=new THREE.Mesh(
  new THREE.BoxGeometry(2.6,3.4,5),
  color
 );
 train.position.y=1.7;
 group.add(train);
 const windowMat=mat(0x80d8ed);
 for(let y of [1.2,2.2]){
  const win=new THREE.Mesh(new THREE.BoxGeometry(1.9,.55,.05),windowMat);
  win.position.set(0,y,2.53);
  group.add(win);
 }
 group.position.set(x,0,z);
 scene.add(group);
 objects.push({mesh:group,type:"obstacle"});
}

function spawn(){
 const lane=Math.floor(Math.random()*3)-1;
 const x=lane*3.1;
 if(Math.random()<.65){
  makeTrash(x,-65);
  if(Math.random()<.5)makeTrash(x,-70);
 }else{
  makeObstacle(x,-75);
 }
}

// Game state
let running=false, lane=0, score=0,trash=0;
let speed=0.35,frame=0,jumpY=0,jumpV=0,sliding=0;
const clock=new THREE.Clock();

function move(dir){
 if(!running)return;
 lane=Math.max(-1,Math.min(1,lane+dir));
}
function jump(){
 if(!running || jumpY>0)return;
 jumpV=.23;
}
function slide(){
 if(!running)return;
 sliding=35;
}

document.getElementById("left").onclick=()=>move(-1);
document.getElementById("right").onclick=()=>move(1);
document.getElementById("jump").onclick=jump;
document.getElementById("slide").onclick=slide;

document.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft"||e.key==="a")move(-1);
 if(e.key==="ArrowRight"||e.key==="d")move(1);
 if(e.key==="ArrowUp"||e.key==="w"||e.key===" ")jump();
 if(e.key==="ArrowDown"||e.key==="s")slide();
});

let startX=0,startY=0;
document.addEventListener("touchstart",e=>{
 startX=e.changedTouches[0].clientX;
 startY=e.changedTouches[0].clientY;
},{passive:true});

document.addEventListener("touchend",e=>{
 const dx=e.changedTouches[0].clientX-startX;
 const dy=e.changedTouches[0].clientY-startY;
 if(Math.abs(dx)>30 || Math.abs(dy)>30){
  if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1);
  else if(dy<0)jump();
  else slide();
 }
},{passive:true});

function updateUI(){
 document.getElementById("score").textContent=score;
 document.getElementById("trash").textContent=trash;
 document.getElementById("speed").textContent=(speed/.35).toFixed(1)+"x";
}

function endGame(){
 running=false;
 document.getElementById("message").style.display="flex";
 document.querySelector("#message h1").innerHTML="GAME OVER";
 document.querySelector("#message p").textContent=
 "You collected "+trash+" pieces of trash!";
 document.querySelector("#message .small").textContent=
 "Your score: "+score+" • Try again!";
 document.getElementById("start").textContent="PLAY AGAIN";
}

function reset(){
 objects.forEach(o=>scene.remove(o.mesh));
 objects.length=0;
 score=0;trash=0;speed=.35;frame=0;lane=0;
 jumpY=0;jumpV=0;sliding=0;
 player.position.set(0,0,3);
 player.scale.y=1;
 updateUI();
 document.getElementById("message").style.display="none";
 running=true;
}

document.getElementById("start").onclick=reset;

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.05);

 if(running){
  frame++;
  score+=1;
  speed=Math.min(.9,.35+score*.000025);

  // Smooth lane movement
  player.position.x+=(lane*3.1-player.position.x)*.18;

  // Running animation
  const t=performance.now()*.012;
  legs[0].rotation.x=Math.sin(t)*.7;
  legs[1].rotation.x=-Math.sin(t)*.7;
  arms[0].rotation.x=-Math.sin(t)*.6;
  arms[1].rotation.x=Math.sin(t)*.6;

  // Jump physics
  if(jumpV!==0 || jumpY>0){
   jumpY+=jumpV;
   jumpV-=.012;
   if(jumpY<=0){jumpY=0;jumpV=0;}
  }
  player.position.y=jumpY;

  // Slide
  if(sliding>0)sliding--;
  player.scale.y=sliding>0?.55:1;

  // Spawn objects
  if(frame%65===0)spawn();

  // Move track sleepers
  sleepers.forEach(s=>{
   s.position.z+=speed;
   if(s.position.z>8)s.position.z-=110;
  });

  // Objects
  for(let i=objects.length-1;i>=0;i--){
   const o=objects[i];
   o.mesh.position.z+=speed;

   if(Math.abs(o.mesh.position.z-3)<1.5 &&
      Math.abs(o.mesh.position.x-player.position.x)<1.3){
    if(o.type==="trash"){
     trash++;
     score+=30;
     scene.remove(o.mesh);
     objects.splice(i,1);
     continue;
    }else if(jumpY<1.1 && sliding<=0){
     endGame();
    }
   }
   if(o.mesh.position.z>12){
    scene.remove(o.mesh);
    objects.splice(i,1);
   }
  }
  updateUI();
 }

 camera.position.x+=(player.position.x*.2-camera.position.x)*.05;
 camera.position.y=5+jumpY*.2;
 camera.lookAt(player.position.x*.2,1.2,-4);
 renderer.render(scene,camera);
}
animate();

addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
